<!DOCTYPE html>
<html lang="en" data-theme="material">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="generator" content="3.0.0">
	<meta name="title" content="Cheatsheet">
	<meta name="author" content="eccs0103">
	<meta name="color-scheme" content="system">
	<meta name="description" content="Program for solving tests.">
	<meta name="keywords" content="cheatsheet, test, answers">
	<meta name="robots" content="index, follow">
	<meta name="language" content="English">
	<meta name="revisit-after" content="0 days">
	<title>Library - Cheatsheet</title>
	<link rel="shortcut icon" href="../assets/icons/file-lines.svg">
	<link rel="stylesheet" href="../styles/global.css">
	<link rel="stylesheet" href="../styles/themes/material.css">
	<link rel="stylesheet" href="./view/style.css">
	<script type="module" src="../environment/services/analytics-service.ts"></script>
	<script type="module" src="./controllers/library-controller.ts"></script>
</head>

<body>
	<header class="layer rounded in-top with-padding flex alt-center with-gap">
		<h3 class="title">Cheatsheet</h3>
		<input id="select-all" type="checkbox" hidden>
		<label for="select-all" role="checkbox" class="flex alt-center" title="Select all">
			<span class="icon">Select all</span>
		</label>
		<input id="editing" type="checkbox" hidden>
		<label for="editing" role="checkbox" class="flex alt-center" title="Edit">
			<span class="icon">Edit</span>
		</label>
		<a href="../settings/" class="flex alt-center" title="Settings">
			<span class="icon" id="settings">Settings</span>
		</a>
	</header>
	<main class="with-padding flex column with-gap">
		<ul id="notes" class="flex column with-gap"></ul>
		<p id="empty" class="with-padding">No sheets yet. Add one with the plus button.</p>
	</main>
	<footer class="with-padding large-padding flex column with-gap">
		<button id="open-actions" type="button" class="layer rounded with-padding flex alt-center" title="Actions">
			<span class="icon">Actions</span>
		</button>
		<button id="open-add" type="button" class="layer rounded with-padding flex alt-center" title="Add sheet">
			<span class="icon">Add sheet</span>
		</button>
	</footer>
	<dialog id="add" class="layer rounded with-padding flex column with-gap">
		<h3 class="highlight">Add sheet</h3>
		<input id="files" type="file" accept=".json,application/json" multiple hidden>
		<label for="files" role="button" class="flex alt-center with-gap">
			<span class="icon" id="device">Upload from device</span>
			<span>Upload from device</span>
		</label>
		<form id="link" class="flex alt-center with-gap">
			<span class="icon" id="cloud">Import from link</span>
			<input name="url" type="url" required placeholder="Link to a sheet" class="depth rounded with-padding">
			<button type="submit" class="highlight">Import</button>
		</form>
	</dialog>
	<dialog id="actions" class="layer rounded with-padding flex column with-gap">
		<h3 class="highlight">Actions</h3>
		<button id="download" type="button" class="flex alt-center with-gap">
			<span class="icon">Download selection</span>
			<span>Download selection</span>
		</button>
		<button id="share" type="button" class="flex alt-center with-gap">
			<span class="icon">Share selection</span>
			<span>Share selection</span>
		</button>
		<button id="delete" type="button" class="warn flex alt-center with-gap">
			<span class="icon">Delete selection</span>
			<span>Delete selection</span>
		</button>
	</dialog>
</body>

</html>
